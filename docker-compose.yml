version: '3.9'
services:
  app:
    build: ./server
    env_file:
      - ./server/.env.example
    environment:
      - DATABASE_URL=postgresql://shortlink:shortlink@postgres:5432/shortlink?schema=public
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-supersecretlongsessionkey}
      - PORT=3000
      - APP_URL=http://localhost:3000
      - IP_SALT=${IP_SALT:-change_me}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
